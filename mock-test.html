<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mock Test - Angshu Math Zone</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#222;
}

/* HEADER */

header{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    text-align:center;
    padding:28px 15px;
}

header h1{
    font-size:30px;
    margin-bottom:8px;
}

header p{
    font-size:14px;
}

/* LANGUAGE */

.language{
    background:white;
    text-align:right;
    padding:10px 15px;
    border-bottom:1px solid #ddd;
}

.language button{
    padding:7px 14px;
    border:1px solid #2563eb;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

#bnBtn{
    background:white;
    color:#2563eb;
}

#enBtn{
    background:#2563eb;
    color:white;
}

/* CONTAINER */

.container{
    max-width:1000px;
    margin:auto;
    padding:25px 15px;
}

/* BACK */

.back{
    display:inline-block;
    margin-bottom:20px;
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

/* TITLE */

.page-title{
    background:white;
    padding:25px;
    text-align:center;
    border-radius:15px;
    margin-bottom:25px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.page-title h2{
    color:#1e3a8a;
    margin-bottom:8px;
}

.page-title p{
    color:#666;
}

/* TEST GRID */

.test-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

/* TEST CARD */

.test-card{
    background:white;
    min-height:285px;
    padding:22px 15px;
    border-radius:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    transition:.3s;
}

.test-card:hover{
    transform:translateY(-5px);
}

/* LOGO */

.test-logo{
    width:105px;
    height:105px;
    object-fit:contain;
    margin-bottom:15px;
    display:block;
}

/* OTHER */

.test-icon{
    width:105px;
    height:105px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:70px;
    margin-bottom:15px;
}

.test-card h3{
    color:#2563eb;
    font-size:21px;
    margin-bottom:10px;
}

.test-card p{
    color:#666;
    font-size:14px;
    line-height:1.5;
    margin-bottom:15px;
}

/* BUTTON */

.start-btn{
    display:inline-block;
    padding:10px 20px;
    background:#2563eb;
    color:white;
    border-radius:8px;
    font-weight:bold;
}

/* FOOTER */

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px 15px;
    margin-top:30px;
}

footer p{
    margin:5px;
    font-size:14px;
}

/* MOBILE */

@media(max-width:600px){

    header h1{
        font-size:25px;
    }

    .test-grid{
        grid-template-columns:1fr 1fr;
        gap:12px;
    }

    .test-card{
        min-height:255px;
        padding:18px 8px;
    }

    .test-logo{
        width:80px;
        height:80px;
    }

    .test-icon{
        width:80px;
        height:80px;
        font-size:55px;
    }

    .test-card h3{
        font-size:17px;
    }

    .test-card p{
        font-size:12px;
    }

    .start-btn{
        font-size:12px;
        padding:8px 12px;
    }

}

</style>

</head>
