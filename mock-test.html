<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#222;
}

/* HEADER */

header{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    text-align:center;
    padding:28px 15px;
}

header h1{
    font-size:30px;
    margin-bottom:8px;
}

header p{
    font-size:14px;
}

/* LANGUAGE */

.language{
    background:white;
    text-align:right;
    padding:10px 15px;
    border-bottom:1px solid #ddd;
}

.language button{
    padding:7px 14px;
    border:1px solid #2563eb;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

#bnBtn{
    background:white;
    color:#2563eb;
}

#enBtn{
    background:#2563eb;
    color:white;
}
