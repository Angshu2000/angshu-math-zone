<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Math Battle | Angshu Math Zone</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef4ff,#fff7ed,#f5f3ff);color:#172033}
header{background:linear-gradient(135deg,#2563eb,#7c3aed,#db2777);color:#fff;text-align:center;padding:28px 12px}
header h1{margin:0 0 7px;font-size:30px}header p{margin:0;font-size:15px}
main{max-width:900px;margin:auto;padding:15px 9px 35px}.back{display:inline-block;color:#2563eb;text-decoration:none;font-weight:700;font-size:17px;margin-bottom:12px}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 7px 25px #00000012;border:1px solid #e5e7eb;margin-bottom:14px}
h2{text-align:center;color:#173b78;margin:2px 0 16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-weight:800;color:#334155;margin:10px 0 6px}select,input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px;background:#fff}
button{border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:800;cursor:pointer;width:100%;margin-top:10px}
.primary{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff}.orange{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff}.green{background:linear-gradient(135deg,#16a34a,#059669);color:#fff}
.status{text-align:center;color:#2563eb;font-weight:700;min-height:24px;margin:10px 0}
.panel{display:none}.code{text-align:center;font-size:31px;letter-spacing:7px;font-weight:900;color:#173b78;margin:8px}
#qr{width:max-content;margin:10px auto;padding:10px;background:#fff;border-radius:10px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}.player{text-align:center;border:1px solid #dbe3ef;border-radius:12px;padding:12px;background:#f8fafc}.player b{display:block;font-size:20px;color:#173b78;margin-top:5px}
.battle{display:none}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;border:1px solid #dbe3ef;border-radius:10px;padding:9px;background:#fff}.stat small{display:block;color:#64748b}.stat b{font-size:21px;color:#173b78}
.question{background:#eef6ff;border-radius:14px;text-align:center;font-size:32px;font-weight:900;color:#173b78;padding:25px 10px;margin:14px 0}
.answer{font-size:22px;text-align:center}.result{text-align:center;font-size:18px;font-weight:800;min-height:26px;margin:10px 0}
.winner{text-align:center;padding:18px;border-radius:14px;background:#ecfdf5;border:1px solid #86efac;color:#166534;font-size:23px;font-weight:900}
@media(max-width:600px){header h1{font-size:25px}.row{grid-template-columns:1fr}.question{font-size:28px}.scores{grid-template-columns:repeat(3,1fr)}.stat{padding:7px}.stat b{font-size:18px}.code{font-size:27px}}
</style>
</head>
<body>
<header><h1>🌐 Online Math Battle</h1><p>👥 Two Friends • ⏱️ 240 Seconds • 🏆 Highest Score Wins</p></header>
<main>
<a class="back" href="math-game.html">← Back to Math Game</a>

<section class="card" id="setupCard">
<h2>🎮 Create or Join Battle</h2>
<div class="row">
<div><label>Calculation Type</label><select id="type">
<option value="addition">➕ Addition</option><option value="subtraction">➖ Subtraction</option><option value="multiplication">✖️ Multiplication</option><option value="division">➗ Division</option><option value="mixed">🔀 Mixed</option><option value="square">² Square</option><option value="cube">³ Cube</option><option value="sqrt">√ Square Root</option><option value="cbrt">∛ Cube Root</option>
</select></div>
<div><label>Difficulty</label><select id="level"><option value="easy">🟢 Easy</option><option value="medium">🟡 Medium</option><option value="hard">🔴 Hard</option></select></div>
</div>
<label>Your Name</label><input id="name" maxlength="20" placeholder="Enter your name">
<button class="primary" id="createBtn">🎮 Create Battle</button>
<button class="orange" id="joinShowBtn">🔑 Join with Keyword</button>
<div id="joinBox" style="display:none"><label>6-character Keyword</label><input id="joinCode" maxlength="6" placeholder="ABC123" style="text-transform:uppercase"><button class="green" id="joinBtn">Join Battle</button></div>
<div class="status" id="status"></div>
</section>

<section class="card panel" id="inviteCard">
<h2>📲 Invite Your Friend</h2>
<div class="code" id="roomCode">------</div>
<div id="qr"></div>
<div class="status">QR Code স্ক্যান করুন অথবা উপরের Keyword বন্ধুকে দিন।</div>
<div class="players"><div class="player">👤 You<b id="hostName">Waiting</b></div><div class="player">👥 Friend<b id="guestName">Waiting...</b></div></div>
<button class="green" id="startBtn" style="display:none">▶ Start Battle</button>
</section>

<section class="card battle" id="battleCard">
<h2>⚡ Math Battle</h2>
<div class="scores"><div class="stat"><small>⏱️ Time</small><b id="time">240</b></div><div class="stat"><small>🏆 You</small><b id="myScore">0</b></div><div class="stat"><small>🥇 Friend</small><b id="friendScore">0</b></div></div>
<div class="question" id="question">Get Ready!</div>
<input class="answer" id="answer" type="number" inputmode="numeric" placeholder="Your answer" disabled>
<button class="primary" id="submitBtn" disabled>Submit Answer</button>
<div class="result" id="result"></div>
</section>

<section class="card panel" id="finishCard"><div class="winner" id="winner"></div><button class="primary" onclick="location.href='math-game.html'">← Back to Math Game</button></section>
</main>

<script>
const qs=new URLSearchParams(location.search);
if(qs.get("type"))type.value=qs.get("type");
if(qs.get("level"))level.value=qs.get("level");

let peer,conn,isHost=false,code="",timer=null,endAt=0,running=false;
let myScore=0,friendScore=0,qid=0,correct=0,answered=false,hostAnswers={},lastQuestion={};
const $=id=>document.getElementById(id);
function status(t){$("status").textContent=t}
function makeCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}

function makeQ(t,l){
 let a,b,n,ans,q;
 if(t==="addition"){a=rnd(1,l==="easy"?20:l==="medium"?100:500);b=rnd(1,l==="easy"?20:l==="medium"?100:500);ans=a+b;q=`${a} + ${b} = ?`}
 else if(t==="subtraction"){a=rnd(10,l==="easy"?50:l==="medium"?200:1000);b=rnd(1,a);ans=a-b;q=`${a} − ${b} = ?`}
 else if(t==="multiplication"){a=rnd(1,l==="easy"?10:l==="medium"?30:60);b=rnd(1,l==="easy"?10:l==="medium"?30:60);ans=a*b;q=`${a} × ${b} = ?`}
 else if(t==="division"){b=rnd(2,l==="easy"?10:l==="medium"?20:40);ans=rnd(1,l==="easy"?10:l==="medium"?20:50);a=b*ans;q=`${a} ÷ ${b} = ?`}
 else if(t==="square"){n=rnd(l==="easy"?1:l==="medium"?10:20,l==="easy"?10:l==="medium"?20:40);ans=n*n;q=`${n}² = ?`}
 else if(t==="cube"){n=rnd(l==="easy"?1:l==="medium"?5:10,l==="easy"?5:l==="medium"?10:20);ans=n*n*n;q=`${n}³ = ?`}
 else if(t==="sqrt"){n=rnd(l==="easy"?1:l==="medium"?20:60,l==="easy"?20:l==="medium"?60:120);ans=n;q=`√${n*n} = ?`}
 else if(t==="cbrt"){n=rnd(l==="easy"?1:l==="medium"?11:21,l==="easy"?10:l==="medium"?20:30);ans=n;q=`∛${n*n*n} = ?`}
 else{a=rnd(1,30);b=rnd(1,20);n=rnd(1,10);ans=a+b*n;q=`${a} + ${b} × ${n} = ?`}
 return {q,ans};
}
function send(x){if(conn&&conn.open)conn.send(x)}
function showBattle(){ $("setupCard").style.display="none";$("inviteCard").style.display="none";$("battleCard").style.display="block";$("answer").disabled=false;$("submitBtn").disabled=false;$("answer").focus() }
function syncScores(){ $("myScore").textContent=myScore;$("friendScore").textContent=friendScore }

function startClock(at){
 clearInterval(timer);endAt=at+240000;running=true;showBattle();
 timer=setInterval(()=>{let left=Math.max(0,Math.ceil((endAt-Date.now())/1000));$("time").textContent=left;if(left<=0)finish()},250);
}
function hostNewQuestion(){
 qid++;
 lastQuestion=makeQ($("type").value,$("level").value);
 correct=lastQuestion.ans;hostAnswers={};
 $("question").textContent=lastQuestion.q;$("answer").value="";$("result").textContent="";
 send({kind:"question",id:qid,q:lastQuestion.q});
}
function finish(){
 if(!running)return;running=false;clearInterval(timer);$("answer").disabled=true;$("submitBtn").disabled=true;
 send({kind:"final",score:myScore,other:friendScore});
 $("battleCard").style.display="none";$("finishCard").style.display="block";
 let text=myScore>friendScore?"🏆 YOU WIN!":myScore<friendScore?"🎉 FRIEND WINS!":"🤝 IT'S A DRAW!";
 $("winner").innerHTML=text+"<br><small style='font-size:16px'>Your Score: "+myScore+" &nbsp; | &nbsp; Friend: "+friendScore+"</small>";
}
function setupConnection(name){
 conn.on("open",()=>{send({kind:"hello",name,type:$("type").value,level:$("level").value})});
 conn.on("data",handleData);
 conn.on("close",()=>{if(running){$("result").textContent="Friend disconnected.";finish()}});
}
function handleData(d){
 if(d.kind==="hello"){
  $("guestName").textContent=d.name||"Friend";
  if(!isHost){$("type").value=d.type;$("level").value=d.level;status("Connected to friend's Battle.");}
  if(isHost)$("startBtn").style.display="block";
 }
 if(d.kind==="start")startClock(d.at);
 if(d.kind==="question"){$("question").textContent=d.q;$("answer").value="";$("result").textContent="";answered=false;qid=d.id}
 if(d.kind==="score"){friendScore=d.score;syncScores()}
 if(d.kind==="result"){friendScore=d.hostScore;myScore=d.guestScore;syncScores();$("result").textContent=d.correct?"✅ Correct!":"❌ Wrong!"}
 if(d.kind==="final"){friendScore=d.score;syncScores();finish()}
 if(d.kind==="guestAnswer"&&isHost){
   if(d.id!==qid||hostAnswers.guest)return;
   hostAnswers.guest=true;
   let ok=Number(d.answer)===correct;if(ok)friendScore++;
   send({kind:"result",correct:ok,hostScore:myScore,guestScore:friendScore});
   if(hostAnswers.host)hostNewQuestion();
 }
}
$("createBtn").onclick=()=>{
 let name=$("name").value.trim()||"Player 1";isHost=true;code=makeCode();
 $("hostName").textContent=name;$("roomCode").textContent=code;$("inviteCard").style.display="block";$("createBtn").disabled=true;
 $("qr").innerHTML="";new QRCode($("qr"),{text:location.href.split("?")[0]+"?join="+code,width:190,height:190});
 peer=new Peer("AMZ-"+code);
 peer.on("open",()=>status("Battle ready. Share the QR Code or Keyword."));
 peer.on("connection",c=>{conn=c;setupConnection(name)});
 peer.on("error",()=>status("Connection error. Create a new Battle."));
};
$("startBtn").onclick=()=>{
 if(!conn||!conn.open)return;
 $("startBtn").disabled=true;let at=Date.now()+1200;send({kind:"start",at});startClock(at);hostNewQuestion();
};
$("joinShowBtn").onclick=()=>{$("joinBox").style.display="block"};
$("joinBtn").onclick=()=>{
 let c=$("joinCode").value.trim().toUpperCase(),name=$("name").value.trim()||"Player 2";
 if(c.length!==6){status("6-character Keyword দিন।");return}
 isHost=false;code=c;peer=new Peer();peer.on("open",()=>{conn=peer.connect("AMZ-"+code);setupConnection(name)});peer.on("error",()=>status("Battle পাওয়া যায়নি। Keyword ঠিক আছে কি দেখুন।"));
};
$("submitBtn").onclick=()=>{
 if(!running||answered||$("answer").value==="")return;
 answered=true;let val=Number($("answer").value);
 if(isHost){
   let ok=val===correct;if(ok)myScore++;
   hostAnswers.host=true;syncScores();$("result").textContent=ok?"✅ Correct!":"❌ Wrong!";
   send({kind:"score",score:myScore});
   if(hostAnswers.guest)hostNewQuestion();
 }else{
   send({kind:"guestAnswer",id:qid,answer:val});$("submitBtn").disabled=true;$("result").textContent="Answer submitted…";
 }
};
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")$("submitBtn").click()});
if(qs.get("join")){$("joinCode").value=qs.get("join");$("joinBox").style.display="block";status("QR Code detected. Enter your name and tap Join Battle.");}
</script>
</body>
</html>
