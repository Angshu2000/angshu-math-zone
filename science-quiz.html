<title>Science Quiz - Angshu Math Zone</title>

<style>
*{

    padding:0;
    box-sizing:border-box;

}

body{
    background:#f3f6fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    text-align:center;
    padding:28px 15px;
}

header h1{
    font-size:28px;
    margin-bottom:8px;
}

header p{
    font-size:14px;
}

.language{
    background:white;
    text-align:right;
    padding:10px 15px;
    border-bottom:1px solid #ddd;
}

.language button{
    padding:7px 14px;
    border:1px solid #2563eb;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

#bnBtn{
    background:white;
    color:#2563eb;
}

#enBtn{
    background:#2563eb;
    color:white;
}

.container{
    max-width:750px;
    margin:auto;
    padding:25px 15px;
}

.quiz-box{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

.quiz-title{
    text-align:center;
    color:#1e3a8a;
    margin-bottom:20px;
}

.set-buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.set-button{
    padding:14px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.set-button:hover{
    opacity:.85;
}

.question-number{
    color:#666;
    margin-bottom:12px;
    font-weight:bold;
}

.question{
    font-size:19px;
    font-weight:bold;
    line-height:1.5;
    margin-bottom:20px;
}

.option{
    display:block;
    width:100%;
    padding:13px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;
    background:#f8fafc;
    text-align:left;
    font-size:16px;
    cursor:pointer;
}

.option:hover{
    background:#e0ecff;
}

.correct{
    background:#dcfce7 !important;
    border-color:#16a34a;
}

.wrong{
    background:#fee2e2 !important;
    border-color:#dc2626;
}

.next-btn,
.restart-btn,
.back-btn{
    width:100%;
    padding:13px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.back-btn{
    background:#16a34a;
}

.score{
    text-align:center;
    font-size:28px;
    color:#1e3a8a;
    margin:20px 0;
}

#quiz,
#result{
    display:none;
}

#result{
    text-align:center;
}

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:25px 15px;
    margin-top:30px;
}

@media(max-width:600px){

    header h1{
        font-size:24px;
    }

    .quiz-box{
        padding:20px 15px;
    }

    .question{
        font-size:17px;
    }

    .set-buttons{

    <button class="back-btn"

    </button>

</div>

</div>


<footer>

    <p>© 2026 Angshu Math Zone</p>

/* =====================================================
   QUIZ VARIABLES
===================================================== */

let currentSet = 0;
let currentQuestion = 0;
let score = 0;
let answered = false;
let language = localStorage.getItem("siteLanguage") || "en";


/* =====================================================
   LANGUAGE
===================================================== */

    language = lang;

    localStorage.setItem("siteLanguage",lang);

        document.getElementById("setTitle").textContent =
            "🚆 Select Question Set";

        document.getElementById("completedTitle").textContent =
            "🎉 Quiz Completed!";

        document.getElementById("playAgain").textContent =
            "🔄 Play Again";

        document.getElementById("chooseSet").textContent =
            "📚 Choose Another Set";

        document.getElementById("footerText").textContent =
            "Learn Mathematics • Prepare Better • Achieve More";

        document.getElementById("enBtn").style.background =
            "#2563eb";

        document.getElementById("enBtn").style.color =
            "white";

    */

    if(
        document.getElementById("quiz").style.display === "block"
    ){
        loadQuestion();

}


/* =====================================================
   START SET
===================================================== */

function startSet(setNumber){

    currentSet = setNumber;
    currentQuestion = 0;
    score = 0;

    document.getElementById("setSelection").style.display =
        "none";

    document.getElementById("result").style.display =
        "none";

    document.getElementById("quiz").style.display =
        "block";

    loadQuestion();
}


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion(){

    answered = false;

    const q =
        questionSets[currentSet][currentQuestion];

    let questionText;

    let optionsList;

    if(language === "bn"){

        questionText = q.q_bn;
        optionsList = q.o_bn;

    }else{

        questionText = q.q_en;
        optionsList = q.o_en;
    }


    document.getElementById("questionNumber").textContent =
        language === "bn"
        ?
        "প্রশ্ন " +
        (currentQuestion + 1) +
        " / 10"
        :
        "Question " +
        (currentQuestion + 1) +
        " of 10";


    document.getElementById("question").textContent =
        questionText;


    const options =
        document.getElementById("options");

    options.innerHTML = "";


    optionsList.forEach(function(option,index){

        const button =
            document.createElement("button");

        button.className = "option";

        button.textContent =
            String.fromCharCode(65 + index) +
            ") " +
            option;

        button.onclick = function(){

            checkAnswer(button,index);

        };

        options.appendChild(button);

    });


    document.getElementById("nextBtn").style.display =
        "none";


    document.getElementById("nextBtn").textContent =
        language === "bn"
        ?
        "পরের প্রশ্ন →"
        :
        "Next Question →";
}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(button,index){

    if(answered) return;

    answered = true;

    const correct =
        questionSets[currentSet][currentQuestion].a;

    const buttons =
        document.querySelectorAll(".option");


    if(index === correct){

        button.classList.add("correct");

        score++;

    }else{

        button.classList.add("wrong");

        buttons[correct].classList.add("correct");

    }


    document.getElementById("nextBtn").style.display =
        "block";
}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

    currentQuestion++;

    if(
        currentQuestion <
        questionSets[currentSet].length
    ){

        loadQuestion();

    }else{

        showResult();

    }
}


/* =====================================================
   SHOW RESULT
===================================================== */

function showResult(){

    document.getElementById("quiz").style.display =
        "none";

    document.getElementById("result").style.display =
        "block";


    document.getElementById("score").textContent =
        language === "bn"
        ?
        "আপনার স্কোর: " +
        score +
        " / 10"
        :
        "Your Score: " +
        score +
        " / 10";


    let message;


    if(score >= 8){

        message =
            language === "bn"
            ?
            "🏆 অসাধারণ! আপনার Science প্রস্তুতি খুব ভালো।"
            :
            "🏆 Excellent! Your Science preparation is very good.";

    }else if(score >= 5){

        message =
            language === "bn"
            ?
            "👍 ভালো! আরও ভালো ফলাফলের জন্য অনুশীলন করুন।"
            :
            "👍 Good! Keep practising for better results.";

    }else{

        message =
            language === "bn"
            ?
            "📚 অনুশীলন চালিয়ে যান। আপনি আরও ভালো করতে পারবেন।"
            :
            "📚 Keep practising. You can improve your score.";
    }


    document.getElementById("message").textContent =
        message;
}


/* =====================================================
   RESTART SET
===================================================== */

function restartSet(){

    currentQuestion = 0;
    score = 0;

    document.getElementById("result").style.display =
        "none";

    document.getElementById("quiz").style.display =
        "block";

    loadQuestion();
}


/* =====================================================
   BACK TO SETS
===================================================== */

function backToSets(){

    document.getElementById("result").style.display =
        "none";

    document.getElementById("quiz").style.display =
        "none";

    document.getElementById("setSelection").style.display =
        "block";
}


/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener("DOMContentLoaded",function(){

    setLanguage(language);

});

</script>
