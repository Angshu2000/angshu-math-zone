<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math Calculation Game - Angshu Math Zone</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef4ff,#fff7ed,#f5f3ff);color:#172033}
header{background:linear-gradient(135deg,#2563eb,#7c3aed,#db2777);color:#fff;text-align:center;padding:28px 15px;box-shadow:0 5px 18px #0002}
header h1{margin:0 0 7px;font-size:30px}header p{margin:0;font-size:15px}
main{max-width:850px;margin:auto;padding:18px 12px 35px}
.back{display:inline-block;margin-bottom:14px;color:#2563eb;text-decoration:none;font-weight:bold}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 7px 25px #00000012;border:1px solid #e5e7eb}
h2{text-align:center;color:#312e81;margin:2px 0 15px}
.section-title{text-align:center;font-weight:800;color:#475569;margin:18px 0 10px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.type{border:0;background:#eef2ff;color:#3730a3;padding:12px 7px;border-radius:12px;font-weight:800;cursor:pointer;font-size:14px}
.type:nth-child(2n){background:#ecfeff;color:#0e7490}
.type:nth-child(3n){background:#fff1f2;color:#be123c}
.type.active{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;box-shadow:0 4px 12px #4f46e566;transform:translateY(-1px)}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.level{border:1px solid #d8deea;background:#f8fafc;padding:11px;border-radius:10px;font-weight:bold;cursor:pointer}
.level.active{background:#16a34a;color:#fff;border-color:#16a34a}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:16px 0}
.stat{border-radius:12px;padding:11px;text-align:center;background:#eef4ff}
.stat:nth-child(2){background:#ecfdf5}.stat:nth-child(3){background:#fff7ed}.stat:nth-child(4){background:#fdf2f8}
.stat small{display:block;color:#64748b;margin-bottom:3px}.stat b{font-size:21px}
.question{background:linear-gradient(135deg,#f8fafc,#eef2ff);border-radius:15px;padding:25px 14px;text-align:center;border:2px dashed #c7d2fe}
#question{font-size:34px;font-weight:800;margin-bottom:18px;color:#172554;word-break:break-word}
input{width:100%;padding:14px;font-size:22px;text-align:center;border:2px solid #cbd5e1;border-radius:10px;outline:none}
input:focus{border-color:#6366f1;box-shadow:0 0 0 3px #6366f122}
button.main{width:100%;border:0;border-radius:10px;padding:13px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:12px;background:linear-gradient(135deg,#16a34a,#059669);color:#fff}
button.restart{background:linear-gradient(135deg,#7c3aed,#db2777)}
#message{text-align:center;min-height:27px;margin-top:10px;font-weight:bold;font-size:15px}
.info{text-align:center;color:#64748b;font-size:13px}
.badge{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:bold;margin-bottom:10px}
@media(max-width:600px){
 header{padding:24px 10px}header h1{font-size:25px}
 main{padding:14px 8px 28px}.card{padding:12px;border-radius:16px}
 .types{grid-template-columns:repeat(2,1fr);gap:7px}.type{padding:11px 5px;font-size:12px}
 .levels{gap:7px}.level{padding:10px 5px;font-size:13px}
 .stats{grid-template-columns:repeat(2,1fr);gap:7px}
 #question{font-size:27px}.question{padding:20px 9px}
 input{font-size:20px}.back{font-size:14px}
}
</style>
</head>
<body>
<header>
<h1>🎮 Math Calculation Game</h1>
<p>Challenge your speed • Accuracy • Calculation Skills</p>
</header>

<main>
<a class="back" href="index.html">← Back to Home</a>
<div class="card">
<h2>⚡ Fast Math Challenge</h2>

<div class="section-title">Choose Calculation Type</div>
<div class="types">
<button class="type active" data-type="addition">➕ Addition</button>
<button class="type" data-type="subtraction">➖ Subtraction</button>
<button class="type" data-type="multiplication">✖️ Multiplication</button>
<button class="type" data-type="division">➗ Division</button>
<button class="type" data-type="mixed">🔀 Mixed</button>
<button class="type" data-type="square">² Square</button>
<button class="type" data-type="cube">³ Cube</button>
<button class="type" data-type="sqrt">√ Square Root</button>
<button class="type" data-type="cbrt">∛ Cube Root</button>
</div>

<div class="section-title">Choose Difficulty</div>
<div class="levels">
<button class="level active" data-level="easy">🟢 Easy</button>
<button class="level" data-level="medium">🟡 Medium</button>
<button class="level" data-level="hard">🔴 Hard</button>
</div>

<div class="stats">
<div class="stat"><small>⏱️ Time</small><b id="time">60</b></div>
<div class="stat"><small>🏆 Score</small><b id="score">0</b></div>
<div class="stat"><small>❌ Wrong</small><b id="wrong">0</b></div>
<div class="stat"><small>🎯 Accuracy</small><b id="accuracy">0%</b></div>
</div>

<div class="question">
<div class="badge" id="currentMode">Addition • Easy</div>
<div id="question">Press Start!</div>
<input id="answer" type="number" inputmode="numeric" placeholder="Your answer" disabled>
</div>

<button class="main" id="start">▶ Start Game</button>
<button class="main restart" id="restart" style="display:none">🔄 Play Again</button>
<div id="message"></div>
<p class="info">You have 60 seconds. Press Enter after each answer.</p>
</div>
</main>

<script>
let type="addition",level="easy",score=0,wrong=0,time=60,correctAnswer=0,timer=null,running=false,total=0;
const $=id=>document.getElementById(id);

const typeNames={
 addition:"Addition",subtraction:"Subtraction",multiplication:"Multiplication",
 division:"Division",mixed:"Mixed",square:"Square",cube:"Cube",
 sqrt:"Square Root",cbrt:"Cube Root"
};

document.querySelectorAll(".type").forEach(b=>b.onclick=()=>{
 if(running)return;
 document.querySelectorAll(".type").forEach(x=>x.classList.remove("active"));
 b.classList.add("active"); type=b.dataset.type; updateBadge();
});
document.querySelectorAll(".level").forEach(b=>b.onclick=()=>{
 if(running)return;
 document.querySelectorAll(".level").forEach(x=>x.classList.remove("active"));
 b.classList.add("active"); level=b.dataset.level; updateBadge();
});

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function updateBadge(){$("currentMode").textContent=typeNames[type]+" • "+level[0].toUpperCase()+level.slice(1)}
function exactDiv(){
 let divisor,answer;
 if(level==="easy"){divisor=rnd(2,10);answer=rnd(1,10)}
 else if(level==="medium"){divisor=rnd(2,20);answer=rnd(2,20)}
 else{divisor=rnd(2,40);answer=rnd(5,50)}
 return {a:divisor*answer,b:divisor,answer:answer};
}
function makeBasic(op){
 let count=2,min=1,max=30;
 if(level==="medium"){count=3;min=10;max=100}
 if(level==="hard"){count=4;min=10;max=150}
 let nums=Array.from({length:count},()=>rnd(min,max));
 if(op==="+"){correctAnswer=nums.reduce((x,y)=>x+y,0)}
 else{
   nums.sort((a,b)=>b-a);
   correctAnswer=nums[0]-nums.slice(1).reduce((x,y)=>x+y,0);
   if(correctAnswer<0){nums[0]+=Math.abs(correctAnswer);correctAnswer=nums[0]-nums.slice(1).reduce((x,y)=>x+y,0)}
 }
 $("question").textContent=nums.join(op==="+"?" + ":" - ")+" = ?";
}
function newQuestion(){
 updateBadge();
 let a,b,op,nums;
 if(type==="addition"){makeBasic("+");return}
 if(type==="subtraction"){makeBasic("-");return}
 if(type==="multiplication"){
   if(level==="easy"){a=rnd(1,12);b=rnd(1,12)}
   else if(level==="medium"){a=rnd(10,50);b=rnd(2,20)}
   else{a=rnd(20,100);b=rnd(10,50)}
   correctAnswer=a*b;$("question").textContent=`${a} × ${b} = ?`;return;
 }
 if(type==="division"){
   let d=exactDiv();correctAnswer=d.answer;$("question").textContent=`${d.a} ÷ ${d.b} = ?`;return;
 }
 if(type==="square"){
   let n=level==="easy"?rnd(1,30):level==="medium"?rnd(31,80):rnd(81,120);
   correctAnswer=n*n;$("question").textContent=`${n}² = ?`;return;
 }
 if(type==="cube"){
   let n=level==="easy"?rnd(1,10):level==="medium"?rnd(11,20):rnd(21,30);
   correctAnswer=n*n*n;$("question").textContent=`${n}³ = ?`;return;
 }
 if(type==="sqrt"){
   let n=level==="easy"?rnd(1,5):level==="medium"?rnd(6,9):rnd(10,10);
   let sq=n*n;correctAnswer=n;$("question").textContent=`√${sq} = ?`;return;
 }
 if(type==="cbrt"){
   let n=level==="easy"?rnd(1,10):level==="medium"?rnd(11,20):rnd(21,30);
   let cb=n*n*n;correctAnswer=n;$("question").textContent=`∛${cb} = ?`;return;
 }
 if(type==="mixed"){
   if(level==="easy"){
     let a=rnd(1,20),b=rnd(1,15),c=rnd(1,10),d=rnd(1,10);
     correctAnswer=a+b-c*d;
     $("question").textContent=`${a} + ${b} - ${c} × ${d} = ?`;
   }else if(level==="medium"){
     let a=rnd(10,40),b=rnd(2,15),c=rnd(2,10),d=rnd(1,10);
     correctAnswer=a+b*c-d;
     $("question").textContent=`${a} + ${b} × ${c} - ${d} = ?`;
   }else{
     let a=rnd(10,50),b=rnd(2,15),c=rnd(2,10),d=rnd(2,8),e=rnd(1,10);
     correctAnswer=a+b*c-d*e;
     $("question").textContent=`${a} + ${b} × ${c} - ${d} × ${e} = ?`;
   }
 }
 $("answer").value="";$("answer").focus();
}
function resetStats(){
 score=0;wrong=0;total=0;time=60;
 $("score").textContent=0;$("wrong").textContent=0;$("time").textContent=60;$("accuracy").textContent="0%";
}
function startGame(){
 clearInterval(timer);resetStats();running=true;
 $("message").textContent="";$("start").style.display="none";$("restart").style.display="none";
 $("answer").disabled=false;newQuestion();
 timer=setInterval(()=>{time--;$("time").textContent=time;if(time<=0)endGame()},1000);
}
function check(){
 if(!running||$("answer").value==="")return;
 total++;
 if(Number($("answer").value)===correctAnswer){
   score++;$("message").textContent="✅ Correct! Great job!";
 }else{
   wrong++;$("message").textContent="❌ Wrong! Try the next one!";
 }
 $("score").textContent=score;$("wrong").textContent=wrong;
 $("accuracy").textContent=Math.round(score/total*100)+"%";
 newQuestion();
}
function endGame(){
 clearInterval(timer);running=false;$("answer").disabled=true;
 $("question").textContent=`Game Over! 🎉 Score: ${score}`;
 $("message").textContent=`Correct: ${score} | Wrong: ${wrong} | Accuracy: ${total?Math.round(score/total*100):0}%`;
 $("restart").style.display="block";
}
$("start").onclick=startGame;
$("restart").onclick=startGame;
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")check()});
updateBadge();
</script>
</body>
</html>
